name: Flutter APK

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "linguaquest/**"
      - "server/**"
      - ".github/workflows/flutter-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "linguaquest/**"
      - "server/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

jobs:
  test-flutter:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: linguaquest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  test-server:
    name: Test and compile Dart server
    runs-on: ubuntu-latest
    container: dart:stable

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: dart pub get

      - name: Run server tests
        run: dart test

      - name: Compile server and package matching runtime
        run: |
          mkdir -p build/runtime
          dart compile exe bin/server.dart -o build/server
          cp -a /runtime/. build/runtime/

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaquest-linux-server
          path: |
            server/build/server
            server/build/runtime/
          retention-days: 7


  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs:
      - test-flutter
      - test-server

    defaults:
      run:
        working-directory: linguaquest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          mkdir -p build/delivery
          flutter build apk --release --dart-define=API_BASE_URL=https://api.vonlan233.top
          cp build/app/outputs/flutter-apk/app-release.apk build/delivery/linguaquest.apk

      - name: Build side-by-side Swiss preview APK
        env:
          ORG_GRADLE_PROJECT_lqApplicationIdSuffix: .swiss
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://api.vonlan233.top
          cp build/app/outputs/flutter-apk/app-release.apk build/delivery/linguaquest-swiss.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaquest-release-apk
          path: linguaquest/build/delivery/*.apk
          if-no-files-found: error
          retention-days: 14
