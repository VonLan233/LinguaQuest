name: Flutter APK

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "linguaquest/**"
      - ".github/workflows/flutter-apk.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "linguaquest/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Analyze, test, and build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: linguaquest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaquest-release-apk
          path: linguaquest/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
