version: "2.4"

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:?FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
