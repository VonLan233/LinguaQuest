version: "3.9"

services:
  api:
    build: .
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file: .env.prod
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    # No container healthcheck: the API runs on a `FROM scratch` image with no
    # shell or curl, so a CMD-SHELL healthcheck can never succeed (it would mark
    # the container permanently unhealthy). Health is observed externally via
    # the /health endpoint (e.g. nginx/uptime monitoring).

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linguaquest}
      POSTGRES_USER: ${POSTGRES_USER:-linguaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linguaquest} -d ${POSTGRES_DB:-linguaquest}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
