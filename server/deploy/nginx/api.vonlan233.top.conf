# Reverse proxy for the LinguaQuest backend API.
#
# Deploy:
#   sudo cp server/deploy/nginx/api.vonlan233.top.conf \
#       /etc/nginx/sites-available/linguaquest-api
#   sudo ln -sf /etc/nginx/sites-available/linguaquest-api \
#       /etc/nginx/sites-enabled/linguaquest-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain TLS (adds the :443 server block + HTTP->HTTPS redirect in place):
#   sudo certbot --nginx -d api.vonlan233.top --redirect \
#       --non-interactive --agree-tos -m <you@example.com>
#
# Prereq: DNS A record api.vonlan233.top -> <server public IP>.
# This is an additive server block (specific server_name); it does not touch
# the shared default_server or other sites on the host.

server {
    listen 80;
    listen [::]:80;
    server_name api.vonlan233.top;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 16m;
    }
}
